name: 운영자 댓글 확인·본문 복사 (1회성)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect (확인만), apply (본문 복사), post (새 댓글 작성)'
        required: true
        default: 'inspect'
      videos:
        description: 'inspect: 확인할 영상 ID/URL, 쉼표로 구분'
        required: false
        default: ''
      source:
        description: 'apply·post: 본문을 가져올 운영자 댓글 ID'
        required: false
        default: ''
      target:
        description: 'apply: 본문을 바꿀 운영자 댓글 ID'
        required: false
        default: ''
      video:
        description: 'post: 댓글을 달 영상 ID'
        required: false
        default: ''
      expect_title:
        description: 'post: 영상 제목에 반드시 들어 있어야 하는 문구 (안전장치)'
        required: false
        default: ''

jobs:
  pinned:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Google 인증 토큰 복원
        run: |
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: 실행
        env:
          MODE: ${{ github.event.inputs.mode }}
          VIDEOS: ${{ github.event.inputs.videos }}
          SOURCE: ${{ github.event.inputs.source }}
          TARGET: ${{ github.event.inputs.target }}
          VIDEO: ${{ github.event.inputs.video }}
          EXPECT_TITLE: ${{ github.event.inputs.expect_title }}
        run: |
          if [ "$MODE" = "apply" ]; then
            python pinned.py apply --source "$SOURCE" --target "$TARGET"
          elif [ "$MODE" = "post" ]; then
            python pinned.py post --source "$SOURCE" --video "$VIDEO" --expect-title "$EXPECT_TITLE"
          else
            python pinned.py inspect --videos "$VIDEOS"
          fi
