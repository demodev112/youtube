name: 사라진 댓글 ID로 복구 (1회성)

on:
  workflow_dispatch:
    inputs:
      anchor:
        description: '찾는 댓글과 같은 실행에서 처리된 다른 댓글 ID'
        required: true
      author:
        description: '복구할 댓글의 작성자 표시 이름 (예: @abc)'
        required: true
      window:
        description: 'anchor 앞뒤로 살펴볼 처리 기록 개수'
        required: false
        default: '30'
      dry_run:
        description: 'true 면 후보만 찾고 바꾸지 않음'
        required: false
        default: 'true'

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Google 인증 토큰 복원
        run: |
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      # 처리 기록(processed)이 들어 있는 누적 데이터
      - name: 누적 데이터 복원
        uses: actions/cache/restore@v4
        with:
          path: offender_data.json
          key: modbot-data-${{ github.run_id }}
          restore-keys: |
            modbot-data-

      - name: 복구 실행
        env:
          ANCHOR: ${{ github.event.inputs.anchor }}
          AUTHOR: ${{ github.event.inputs.author }}
          WINDOW: ${{ github.event.inputs.window }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          extra=""
          if [ "$DRY_RUN" = "true" ]; then extra="--dry-run"; fi
          python recover.py --anchor "$ANCHOR" --author "$AUTHOR" --window "${WINDOW:-30}" $extra
