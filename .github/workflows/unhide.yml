name: 댓글 숨김 해제 (1회성)

on:
  workflow_dispatch:
    inputs:
      match:
        description: '복구할 댓글 본문 일부. 여러 개는 | 로 구분'
        required: true
      max_threads:
        description: '상태별로 훑을 최대 스레드 수'
        required: false
        default: '400'
      hide:
        description: 'true 면 공개 대신 숨김(검토 대기)으로 바꿈 (잘못 복구한 댓글 되돌리기)'
        required: false
        default: 'false'
      dry_run:
        description: 'true 면 찾기만 하고 바꾸지 않음'
        required: false
        default: 'false'
      remove_if_hide_fails:
        description: 'hide 가 true 일 때, 숨김이 반영되지 않으면 삭제(작성자 차단 없음)로 공개에서 내림'
        required: false
        default: 'false'
      owner_reply_only:
        description: 'true 면 운영자 답글이 달린 최상위 댓글만 복구 (없으면 숨김으로 되돌리지만 YouTube 가 반영 안 할 수 있음)'
        required: false
        default: 'false'

jobs:
  unhide:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Google 인증 토큰 복원
        run: |
          echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: 숨김 해제 실행
        env:
          MATCH: ${{ github.event.inputs.match }}
          MAX_THREADS: ${{ github.event.inputs.max_threads }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          HIDE: ${{ github.event.inputs.hide }}
          OWNER_REPLY_ONLY: ${{ github.event.inputs.owner_reply_only }}
          REMOVE_IF_HIDE_FAILS: ${{ github.event.inputs.remove_if_hide_fails }}
        run: |
          extra=""
          if [ "$DRY_RUN" = "true" ]; then extra="--dry-run"; fi
          if [ "$HIDE" = "true" ]; then extra="$extra --hide"; fi
          if [ "$OWNER_REPLY_ONLY" = "true" ]; then extra="$extra --owner-reply-only"; fi
          if [ "$REMOVE_IF_HIDE_FAILS" = "true" ]; then extra="$extra --remove-if-hide-fails"; fi
          python unhide.py --match "$MATCH" --max "${MAX_THREADS:-400}" $extra
